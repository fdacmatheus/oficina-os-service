# O Secret oficina-os-secrets (JWT_SECRET) NAO e versionado: o pipeline
# o cria a partir dos secrets do GitHub antes do kubectl apply.
# Credenciais AWS vem do perfil da instancia dos nodes (LabRole no AWS Academy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-os-service
  namespace: oficina
  labels:
    app: oficina-os-service
    app.kubernetes.io/part-of: oficina
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app: oficina-os-service
  template:
    metadata:
      labels:
        app: oficina-os-service
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3001'
        prometheus.io/path: '/api/metrics'
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: IMAGEM_PLACEHOLDER
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: oficina-os-config
            - secretRef:
                name: oficina-os-secrets
          startupProbe:
            httpGet: { path: /api/health, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities: { drop: ['ALL'] }
